<svg viewBox="0 0 800 306" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @keyframes fadeUp { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }
            @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
            @keyframes underline { 0% { stroke-dashoffset: 240; } 100% { stroke-dashoffset: 0; } }
            @keyframes dot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
            @keyframes slideLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-960px); } }
            @keyframes slideRight { 0% { transform: translateX(0); } 100% { transform: translateX(384px); } }

            .f1 { animation: fadeUp 0.6s ease-out 0.1s both; }
            .f2 { animation: fadeUp 0.6s ease-out 0.3s both; }
            .f3 { animation: fadeUp 0.6s ease-out 0.5s both; }
            .strip-top { animation: slideLeft 37.5s linear infinite; transform-origin: 0 0; }
            .strip-bottom { animation: slideRight 15s linear infinite; transform-origin: 0 0; }
            .cursor { animation: blink 1s step-end infinite; }
            .rule { stroke-dasharray: 240; animation: underline 1.2s ease-out 0.2s both; }
            .d1 { animation: dot 1.6s ease-in-out infinite; }
            .d2 { animation: dot 1.6s ease-in-out infinite 0.2s; }
            .d3 { animation: dot 1.6s ease-in-out infinite 0.4s; }
        </style>
    </defs>

    <!-- Background -->
    <rect width="800" height="306" fill="#0d1117"/>
    <rect x="0.5" y="0.5" width="799" height="305" fill="none" stroke="#21262d" stroke-width="1"/>

    <!-- Top-right status (moved above the strip, clear of it) -->
    <g class="f1">
        <circle cx="704" cy="20" r="3" fill="#3fb950" class="d1"/>
        <circle cx="716" cy="20" r="3" fill="#3fb950" class="d2"/>
        <circle cx="728" cy="20" r="3" fill="#3fb950" class="d3"/>
        <text x="740" y="24" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681" text-anchor="start">available</text>
    </g>

    <!-- Top icon strip -->
    <defs>
        <clipPath id="topStripClip"><rect x="40" y="36" width="720" height="32" rx="16"/></clipPath>
        <clipPath id="bottomStripClip"><rect x="40" y="266" width="720" height="24" rx="12"/></clipPath>
    </defs>
