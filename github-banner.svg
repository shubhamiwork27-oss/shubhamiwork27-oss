            <g transform="translate(768,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#4ecdc4" text-anchor="middle">Docker</text></g>
            <g transform="translate(864,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#ffd166" text-anchor="middle">CLI</text></g>
            <g transform="translate(960,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#58a6ff" text-anchor="middle">VS Code</text></g>
            <g transform="translate(1056,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#ff7b72" text-anchor="middle">Git</text></g>
            <g transform="translate(1152,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#d2a8ff" text-anchor="middle">GitHub</text></g>
