            <g transform="translate(96,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#ff7b72" text-anchor="middle">Git</text></g>
            <g transform="translate(192,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#d2a8ff" text-anchor="middle">GitHub</text></g>
            <g transform="translate(288,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#7ee787" text-anchor="middle">API</text></g>
