            <g transform="translate(1536,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#f9d423" text-anchor="middle">Render</text></g>
            <g transform="translate(1632,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#ff6b6b" text-anchor="middle">npm</text></g>
            <g transform="translate(1728,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#4ecdc4" text-anchor="middle">Docker</text></g>
            <g transform="translate(1824,4)"><rect x="0" width="80" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="40.0" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#ffd166" text-anchor="middle">CLI</text></g>
        </g>
        </g>
    </g>

    <!-- Name -->
    <text x="40" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3" class="f1">Shubham Idnani</text>

    <!-- Title with typing cursor -->
    <text x="40" y="126" font-family="monospace" font-size="18" fill="#6997d6" class="f2">MERN Stack Developer<tspan class="cursor" fill="#58a6ff">|</tspan></text>

    <!-- Underline rule -->
    <line x1="40" y1="139" x2="280" y2="134" stroke="#30363d" stroke-width="1" class="rule"/>

